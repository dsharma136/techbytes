[project]
name = "ai-pulse-scrapers"
version = "0.2.0"
description = "TechBytes / AI Pulse scrapers, LangGraph pipeline, and FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "groq>=0.11.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "upstash-redis>=1.0.0",
]

[tool.vercel]
entrypoint = "backend.api.server:app"
